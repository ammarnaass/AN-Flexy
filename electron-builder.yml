appId: dz.anflexy.app
productName: AN Flexy
directories:
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
extraResources:
  - from: src/main/core/db/migrations
    to: migrations
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
  category: Office
